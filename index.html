<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Refajo Kola Sol & Poker</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js"></script>
</head>
<body>

    <div class="hero-container">
        <!-- Tarjeta Izquierda (Recuadro del Refajo) -->
        <div class="product-card-wrapper">
            <div class="refajo-card">
                <span class="brand-subtitle">Gaseosas Sol</span>
                <h2 class="brand-title">Refajo</h2>
                <span class="badge-flavor">Kola Sol + Poker</span>
            </div>
        </div>

        <!-- Información Derecha -->
        <div class="product-details">
            <div class="brand-header">
                <div class="brand-logos">
                    <img src="ruta-logo-kolasol.png" alt="Logo Kola Sol" class="brand-logo">
                    <span class="collab-icon">×</span>
                    <img src="ruta-logo-poker.png" alt="Logo Poker" class="brand-logo">
                </div>
                <span class="tag-edition">✦ Edición Limitada Octubre / Verano ✦</span>
            </div>

            <h1 class="product-title">Refajo Kola Sol + Poker</h1>
            <p class="product-description">
                La mezcla épica que prende todos los parches del verano y las fiestas de octubre. Destapa el verdadero sabor refrescante.
            </p>

            <div class="action-buttons">
                <button class="btn-primary">Descubrir el Sabor</button>
                <button class="btn-secondary">Ver Comercial</button>
            </div>

            <div class="specs-container">
                <div class="spec-item">
                    <span class="spec-value">100%</span>
                    <span class="spec-label">Sabor Colombiano</span>
                </div>
                <div class="spec-item">
                    <span class="spec-value">350ml</span>
                    <span class="spec-label">Lata Helada</span>
                </div>
                <div class="spec-item">
                    <span class="spec-value">1.5L</span>
                    <span class="spec-label">Tetra Pak Familiar</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
